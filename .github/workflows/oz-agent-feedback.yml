name: "@oz-agent feedback loop"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    # Weekly self-improvement loop: every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "self-improve"
        type: choice
        options:
          - self-improve
          - respond-to-feedback

# Only one feedback loop should run at a time per repo
concurrency:
  group: oz-agent-feedback-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-mention:
    name: Detect @oz-agent mention
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@oz-agent')
      && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      comment_body: ${{ steps.check.outputs.comment_body }}
      comment_author: ${{ steps.check.outputs.comment_author }}
      comment_id: ${{ steps.check.outputs.comment_id }}
      issue_number: ${{ steps.check.outputs.issue_number }}
      is_pr: ${{ steps.check.outputs.is_pr }}
    steps:
      - name: Extract comment context
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "comment_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMENT_BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "comment_author=$COMMENT_AUTHOR" >> "$GITHUB_OUTPUT"
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

          # Determine issue/PR number
          if [ "${{ github.event.issue.pull_request }}" != "" ] || [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=${{ github.event.pull_request.number || github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "issue_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

  respond:
    name: Respond to feedback
    needs: detect-mention
    if: needs.detect-mention.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Acknowledge with reaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            repos/${{ github.repository }}/issues/comments/${{ needs.detect-mention.outputs.comment_id }}/reactions \
            -f content='+1' || true

      - name: Run respond-to-feedback via Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ needs.detect-mention.outputs.comment_body }}
          COMMENT_AUTHOR: ${{ needs.detect-mention.outputs.comment_author }}
          ISSUE_NUMBER: ${{ needs.detect-mention.outputs.issue_number }}
          IS_PR: ${{ needs.detect-mention.outputs.is_pr }}
          REPO: ${{ github.repository }}
          EVENT_TYPE: ${{ github.event_name }}
        run: |
          # Install Claude Code if not available
          if ! command -v claude &> /dev/null; then
            npm install -g @anthropic-ai/claude-code
          fi

          claude -p "Read the respond-to-feedback skill at plugins/self-improvement/skills/respond-to-feedback/SKILL.md and execute it. The comment body is in the COMMENT_BODY env var, author in COMMENT_AUTHOR, issue/PR number in ISSUE_NUMBER, repo in REPO, and IS_PR tells you if it's a PR comment." \
            --allowedTools "Bash,Read,Write,Edit" \
            --max-turns 30

  self-improve:
    name: Weekly self-improvement
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'self-improve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run self-improve-skills via Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Install Claude Code if not available
          if ! command -v claude &> /dev/null; then
            npm install -g @anthropic-ai/claude-code
          fi

          claude -p "Read the self-improve-skills skill at plugins/self-improvement/skills/self-improve-skills/SKILL.md and execute it for the repository $REPO. Analyze the last 14 days of agent evidence and propose companion skill updates if warranted." \
            --allowedTools "Bash,Read,Write,Edit" \
            --max-turns 50
